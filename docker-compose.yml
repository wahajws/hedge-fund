services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: development
      API_PORT: 4000
      CORS_ORIGIN: http://127.0.0.1:5173
      USE_MOCK_PROVIDERS: "true"
      QWEN_MODEL: qwen-plus
      QWEN_BASE_URL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions
      DATABASE_URL: postgres://macro:macro@postgres:5432/macro_ai_os
      REDIS_URL: redis://redis:6379
      AUDIT_HASH_SECRET: local-audit-secret
      JWT_SECRET: local-dev-only
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: macro
      POSTGRES_DB: macro_ai_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:

